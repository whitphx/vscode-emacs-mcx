name: Changesets

on:
  push:
    branches: ["main"]

permissions: {} # No permissions needed as we use a PAT. Make sure the PAT has the proper permissions. See below.

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # For Takumi Guard OIDC-based audit logging.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # `persist-credentials: false` is important not only for security reasons
          # but also to ensure that git operations in the later steps don't use the default GITHUB_TOKEN,
          # which doesn't trigger other workflows such as the release workflow.
          # Ref: https://github.com/orgs/community/discussions/26220
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Set up Takumi Guard for npm
        uses: flatt-security/setup-takumi-guard-npm@f0e333d43cd7a88d2caabee1f16048baab3a35a9 # v1.1.1
        with:
          bot-id: ${{ vars.TAKUMI_GUARD_BOT_ID }}
      - name: Install Aikido Safe Chain
        uses: ./.github/actions/install-safe-chain

      - name: Install dependencies
        run: npm ci
        env:
          # The Changesets release job does not run browser tests. Skip
          # Playwright's postinstall browser download so `npm ci` only installs
          # package dependencies and cannot hang on browser provisioning.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CHANGESETS_APP_ID }}
          private-key: ${{ secrets.CHANGESETS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Release Pull Request or Tag
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: npm run changeset:release
          # PRs created using `GITHUB_TOKEN` doesn't trigger CI workflows, so we need to use a PAT or app token.
          # - The PAT should be fine-grained and its permissions are properly configured (R/W for Contents and Pull Requests).
          # - The app token should be generated using a GitHub App that has proper permissions (R/W for Contents and Pull Requests).
          # Ref: https://github.com/orgs/community/discussions/55906
          # changesets/action v2 only accepts a custom token through this input, not the GITHUB_TOKEN env var.
          # It also pushes the git tags created by the publish script through the GitHub API with this token.
          github-token: ${{ steps.generate-token.outputs.token }}
          # github-token: ${{ secrets.CHANGESETS_PAT }}
