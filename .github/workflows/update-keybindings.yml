name: Update Keybindings

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  update-keybindings:
    runs-on: ubuntu-latest
    # The PR is pushed and opened with the GitHub App token generated below, so the
    # workflow's own `GITHUB_TOKEN` only needs to read the repository.
    permissions:
      contents: read
      id-token: write # For Takumi Guard OIDC-based audit logging.

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Set up Takumi Guard for npm
        uses: flatt-security/setup-takumi-guard-npm@9a5d797c2085b6326d3a2985c08e3a114b9b88c1 # v1.1.1
        with:
          bot-id: ${{ vars.TAKUMI_GUARD_BOT_ID }}
      - name: Install Aikido Safe Chain
        uses: ./.github/actions/install-safe-chain

      - name: Install dependencies
        run: npm ci
        env:
          # The Changesets release job does not run browser tests. Skip
          # Playwright's postinstall browser download so `npm ci` only installs
          # package dependencies and cannot hang on browser provisioning.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Generate keybindings
        run: npm run gen-keys

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet package.json; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create changeset
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          node -e "
          const writeChangeset = require('@changesets/write').default ?? require('@changesets/write');
          writeChangeset(
            {
              summary: 'Update keybindings from the latest remote definitions.',
              releases: [{ name: 'emacs-mcx', type: 'patch' }],
            },
            process.cwd()
          );
          "
      # PRs opened with `GITHUB_TOKEN` don't run CI workflows without a manual approval,
      # so open the PR as the Changesets GitHub App instead, the same way the
      # Changesets workflow does. The token is scoped to this repository and to the
      # two permissions the steps below need.
      # Ref: https://docs.github.com/en/actions/using-workflows/triggering-a-workflow#triggering-a-workflow-from-a-workflow
      - name: Generate a token
        if: steps.changes.outputs.has_changes == 'true'
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CHANGESETS_APP_ID }}
          private-key: ${{ secrets.CHANGESETS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          add-paths: |
            package.json
            .changeset/*.md
          commit-message: "Update keybindings in package.json"
          title: "chore: Update keybindings from latest remote definitions"
          body: |
            This PR automatically updates the keybindings in `package.json` by running `npm run gen-keys`.

            The keybinding generator depends on remote files that are sometimes updated, so this ensures our keybinding definitions stay up-to-date.
          branch: auto-update-keybindings
          delete-branch: true
          labels: |
            automated
            keybindings

      # Auto-merge waits for the status checks the `main` ruleset requires, so the PR
      # is merged only after CI passes. `--match-head-commit` pins the merge to the
      # commit this run pushed: if anything else lands on the branch, the merge is
      # refused. The file check below makes sure the PR touches nothing but the
      # generated files before auto-merge is turned on.
      - name: Enable auto-merge
        if: >-
          steps.cpr.outputs.pull-request-operation == 'created' ||
          steps.cpr.outputs.pull-request-operation == 'updated'
        run: |
          unexpected_files="$(gh pr view "$PR_NUMBER" --json files --jq '.files[].path' | grep -Ev '^(package\.json|\.changeset/[^/]+\.md)$' || true)"
          if [ -n "$unexpected_files" ]; then
            echo "::error::The PR changes files other than the generated ones; not enabling auto-merge:"
            echo "$unexpected_files"
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --auto --squash --match-head-commit "$HEAD_SHA"
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
